<script>
  // Compte à rebours live (jours:heures:minutes:secondes)
  // Terme : 15 juillet 2026 à 00h00, heure du Luxembourg (CEST, UTC+2).
  const target = new Date('2026-07-15T00:00:00+02:00');

  const el = document.getElementById('countdown');
  const pad = n => String(n).padStart(2, '0');

  function tick(){
    let diff = Math.max(0, target - new Date());
    const d = Math.floor(diff / 86400000); diff -= d * 86400000;
    const h = Math.floor(diff / 3600000);  diff -= h * 3600000;
    const m = Math.floor(diff / 60000);    diff -= m * 60000;
    const s = Math.floor(diff / 1000);
    const str = `${pad(d)}j${pad(h)}:${pad(m)}:${pad(s)}`;
    // Chaque chiffre dans une boîte de largeur fixe -> l'affichage ne bouge plus.
    // Dans chaque paire : 1er chiffre justifié à droite, 2e à gauche -> ils se resserrent.
    let pos = 0;
    el.innerHTML = [...str].map(ch => {
      if (ch === ':') { pos = 0; return '<span class="inline-block w-[.30em] text-center">:</span>'; }
      const align = pos === 0 ? 'text-right' : 'text-left';
      pos++;
      return `<span class="inline-block w-[.64em] ${align}">${ch}</span>`;
    }).join('');
  }
  tick();
  setInterval(tick, 1000);

  // Lien de contact anti-bots : l'adresse est encodée (base64) et le mailto
  // n'est assemblé qu'au moment de l'interaction -> jamais en clair dans la source.
  (function(){
    const a = document.getElementById('contact-link');
    if (!a) return;
    const reveal = () => { a.href = 'mailto:' + atob('Y29udGFjdEBtaWthZG8ubHU='); };
    a.addEventListener('mouseenter', reveal, { once: true });
    a.addEventListener('focus', reveal, { once: true });
    a.addEventListener('touchstart', reveal, { once: true, passive: true });
    a.addEventListener('click', reveal); // garantit le href avant la navigation
  })();
</script>
